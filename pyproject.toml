[project]
name = "agentic_kg"
version = "0.5.1"
description = "Multi-agent system that builds a Neo4j knowledge graph from source files, built on Google ADK"
readme = "README.md"
authors = [
    { name = "volkovyy-00" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "clevercsv[full]>=0.8.3",
    "fsspec>=2024.9,<2025.0.0",
    "google-adk>=1.10,<2",
    # >=1.82.3 required for GPT-5 / reasoning-model streaming: it maps `reasoning`
    # -> `reasoning_content` in the streaming Delta and requires openai>=2.8.0,
    # which understands GPT-5's reasoning stream events (old openai 1.54 parsed
    # them as unknown chunks, so CustomStreamWrapper never terminated -> hang).
    "litellm>=1.83.9,<1.84",
    # litellm 1.83.9 hard-pins openai==2.24.0; stated here so the requirement is explicit.
    "openai>=2.24,<3",
    "neo4j>=5.28.2,<6",
    "neo4j-graphrag>=1.9.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
]

[project.scripts]
agentic_kg = "agentic_kg:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.2.0",
    "ruff>=0.16.2",
    "testcontainers>=4.7.2",
]

# Pytest defaults for convenience
[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: mark tests that require external services such as Docker/Neo4j",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Pinned explicitly rather than left as the implicit default: this Ruff version's actual
# built-in default already covers many more categories (pyupgrade, bugbear, pylint-refactor,
# ruff-specific...) than the classic E4/E7/E9/F baseline, and several of those require real
# code changes rather than a mechanical fix. `select` (not `extend-select`) replaces that
# broader default outright, keeping this first pass to auto-fixable style/import issues only.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Deliberate late imports: env validation / a module-level DB singleton must run
# before importing sibling modules that depend on it having already run.
"src/agentic_kg/coordinators/multi_agent/agent.py" = ["E402"]
"src/agentic_kg/coordinators/multi_agent/sub_agents/schema_proposal_agent/agent.py" = ["E402"]
"src/agentic_kg/coordinators/single_agent/agent.py" = ["E402"]
"src/agentic_kg/tools/construction_plan_tools.py" = ["E402"]
"tests/unit/test_cypher_tools.py" = ["E402"]
"tests/unit/test_graph_profile.py" = ["E402"]
"tests/unit/test_neo4j_for_adk.py" = ["E402"]
