name: Tag release

# Every changelog-worthy PR bumps pyproject.toml's version (CONTRIBUTING.md), so a push to
# main carrying a version with no tag yet is a release: tag it. Pushes that leave the version
# alone find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag the version if it is new
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
          echo "Tagged ${GITHUB_SHA} as ${tag}."
