name: Type Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Pyright
        # Codebase has no prior type coverage, so a non-zero exit is expected today --
        # this is a visibility check, not a required gate (see docs/backlog/pyright-static-type-checking.md).
        continue-on-error: true
        run: uv run pyright
